<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Biology Flashcards</title>
<!-- Edge case: cards live in a JS array literal (not JSON): unquoted keys, mixed quote styles,
     escaped quotes, a multi-line template literal, inline // and /* */ comments, trailing commas,
     HTML inside answers, emoji, extra fields (category, hint). Cards are rendered dynamically.
     Long explanatory answers should become multiple-choice in the quiz. -->
<style>
  :root { --bg: #f0fdf4; --card: #ffffff; --accent: #16a34a; --text: #14532d; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--text);
         display: grid; place-items: center; min-height: 100vh; }
  .wrap { width: min(640px, 92vw); }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .pill { background: #dcfce7; padding: 4px 12px; border-radius: 999px; font-size: .85rem; }
  .card { background: var(--card); border-radius: 16px; min-height: 260px; padding: 36px; box-shadow: 0 10px 30px rgba(22,101,52,.15);
          display: flex; flex-direction: column; justify-content: center; cursor: pointer; transition: transform .2s; }
  .card:hover { transform: translateY(-2px); }
  .q { font-size: 1.4rem; }
  .a { font-size: 1.1rem; line-height: 1.6; display: none; border-top: 2px dashed #bbf7d0; margin-top: 20px; padding-top: 18px; }
  .card.show .a { display: block; }
  .hint { font-size: .9rem; color: #65a30d; margin-top: 12px; font-style: italic; }
  nav { display: flex; justify-content: space-between; margin-top: 18px; align-items: center; }
  nav button { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 1rem; }
  .progress { height: 6px; background: #bbf7d0; border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🧬 Cell Biology</h1><span class="pill" id="cat"></span></header>
  <div class="card" id="card"><div class="q" id="q"></div><div class="hint" id="hint"></div><div class="a" id="a"></div></div>
  <div class="progress"><div id="bar"></div></div>
  <nav><button id="prev">Previous</button><span id="count"></span><button id="next">Next</button></nav>
</div>
<script>
  // Flashcard data — edit freely
  const flashcards = [
    // --- Cell structure ---
    { category: "Structure", question: "What is the powerhouse of the cell?", answer: "The mitochondria", hint: "It makes ATP" },
    { category: 'Structure', question: 'What does the cell membrane do?',
      answer: 'It controls what enters and leaves the cell and protects the cell from its surroundings.' },
    {
      category: "Structure",
      question: "What is the function of ribosomes?",
      answer: `Ribosomes synthesize proteins by translating messenger RNA
into chains of amino acids.`,
    },
    { category: "Structure", question: 'Which organelle is called the cell\'s "post office"?', answer: "The Golgi apparatus", },
    /* --- Genetics --- */
    { category: "Genetics", question: "What does DNA stand for?", answer: "Deoxyribonucleic acid" },
    { category: "Genetics", question: "Which base pairs with adenine in DNA?", answer: "Thymine", hint: 'Not uracil — that\'s RNA' },
    { category: "Genetics", question: "What is a <b>codon</b>?", answer: "A sequence of <b>three</b> nucleotides that codes for one amino acid." },
    { category: "Genetics", question: "How many chromosomes do human somatic cells have?", answer: "46 (23 pairs)" },
    // --- Processes ---
    { category: "Processes", question: "What is the difference between mitosis and meiosis?",
      answer: "Mitosis produces two identical diploid cells for growth and repair, while meiosis produces four genetically different haploid gametes." },
    { category: "Processes", question: "Photosynthesis takes place in which organelle? 🌱", answer: "Chloroplast" },
    { category: "Processes", question: "What is the main product of glycolysis?", answer: "Pyruvate (plus 2 ATP and 2 NADH)" },
    { category: "Processes", question: "Is osmosis a form of active transport?", answer: "No — osmosis is passive transport." },
  ];

  let idx = 0;
  const $ = id => document.getElementById(id);
  function render() {
    const c = flashcards[idx];
    $('q').innerHTML = c.question;
    $('a').innerHTML = c.answer;
    $('hint').textContent = c.hint ? '💡 ' + c.hint : '';
    $('cat').textContent = c.category;
    $('count').textContent = `${idx + 1} / ${flashcards.length}`;
    $('bar').style.width = ((idx + 1) / flashcards.length * 100) + '%';
    $('card').classList.remove('show');
  }
  $('card').onclick = () => $('card').classList.toggle('show');
  $('next').onclick = () => { if (idx < flashcards.length - 1) { idx++; render(); } };
  $('prev').onclick = () => { if (idx > 0) { idx--; render(); } };
  render();
</script>
</body>
</html>
