<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Flashcard Viewer deck editor">
<meta name="fv-theme" content="app">
<title>Chemistry basics</title>
<style>
/* Look of decks made with the deck editor (inlined into each deck file).
 * Inside Flashcard Viewer the deck helper sets the --fv-* variables from the app's theme, font and
 * corner settings; opened anywhere else, the fallbacks below follow the browser's light/dark mode. */
:root {
  --fv-primary: #6750a4; --fv-on-primary: #fff;
  --fv-primary-container: #eaddff; --fv-on-primary-container: #21005d;
  --fv-secondary-container: #e8def8; --fv-on-secondary-container: #1d192b;
  --fv-tertiary-container: #ffd8e4; --fv-on-tertiary-container: #31111d;
  --fv-surface: #fef7ff; --fv-on-surface: #1d1b20; --fv-on-surface-variant: #49454f;
  --fv-surface-container-low: #f7f2fa; --fv-surface-container: #f3edf7;
  --fv-surface-container-high: #ece6f0; --fv-surface-container-highest: #e6e0e9;
  --fv-outline: #79747e; --fv-outline-variant: #cac4d0;
  --fv-error: #b3261e; --fv-error-container: #f9dedc; --fv-on-error-container: #410e0b;
  --fv-good: #2e7d32;
  --fv-font: "Roboto Flex", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fv-mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --fv-corner: 1;
  --fv-font-scale: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-fv-mode]) {
    --fv-primary: #d0bcff; --fv-on-primary: #381e72;
    --fv-primary-container: #4f378b; --fv-on-primary-container: #eaddff;
    --fv-secondary-container: #4a4458; --fv-on-secondary-container: #e8def8;
    --fv-tertiary-container: #633b48; --fv-on-tertiary-container: #ffd8e4;
    --fv-surface: #141218; --fv-on-surface: #e6e0e9; --fv-on-surface-variant: #cac4d0;
    --fv-surface-container-low: #1d1b20; --fv-surface-container: #211f26;
    --fv-surface-container-high: #2b2930; --fv-surface-container-highest: #36343b;
    --fv-outline: #938f99; --fv-outline-variant: #49454f;
    --fv-error: #f2b8b5; --fv-error-container: #8c1d18; --fv-on-error-container: #f9dedc;
    --fv-good: #81c784;
    color-scheme: dark;
  }
}
:root[data-fv-mode="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fv-surface);
  color: var(--fv-on-surface);
  font-family: var(--fv-font);
  font-size: calc(16px * var(--fv-font-scale));
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }

.fv-app {
  max-width: 820px; min-height: 100vh; margin: 0 auto;
  padding: 28px 20px 24px;
  display: flex; flex-direction: column; gap: 18px;
}

/* ---- header ---- */
.fv-head { display: flex; align-items: center; gap: 16px; }
.fv-emoji {
  flex: none; width: 56px; height: 56px; display: grid; place-items: center; font-size: 30px;
  border-radius: calc(16px * var(--fv-corner));
  background: var(--fv-secondary-container); color: var(--fv-on-secondary-container);
}
.fv-titles { min-width: 0; }
.fv-title { margin: 0; font-size: 1.6em; line-height: 1.2; font-weight: 600; letter-spacing: 0; overflow-wrap: anywhere; }
.fv-desc { margin: 4px 0 0; color: var(--fv-on-surface-variant); font-size: .95em; overflow-wrap: anywhere; }
.fv-desc p { margin: 0; }

/* ---- progress bar ---- */
.fv-bar { display: flex; align-items: center; gap: 10px; }
.fv-count {
  flex: none; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: .85em;
  background: var(--fv-secondary-container); color: var(--fv-on-secondary-container);
  font-variant-numeric: tabular-nums;
}
.fv-track { flex: 1; height: 6px; border-radius: 999px; background: var(--fv-surface-container-highest); overflow: hidden; }
.fv-fill { height: 100%; width: 0; border-radius: inherit; background: var(--fv-primary); transition: width .3s ease; }

/* ---- buttons (M3 state layers via ::before) ---- */
.fv-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 20px; border: 0; border-radius: 999px; cursor: pointer;
  font-weight: 500; font-size: .9em; letter-spacing: .01em; overflow: hidden; user-select: none;
  background: transparent; color: var(--fv-primary);
}
.fv-btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; }
.fv-btn:hover::before { opacity: .08; }
.fv-btn:active::before { opacity: .12; }
.fv-btn:focus-visible { outline: 3px solid var(--fv-primary); outline-offset: 2px; }
.fv-btn[hidden] { display: none; }
.fv-btn:disabled { opacity: .38; cursor: default; }
.fv-btn:disabled::before { opacity: 0; }
.fv-btn svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.fv-icon { width: 48px; height: 48px; min-height: 0; padding: 0; color: var(--fv-on-surface-variant); }
.fv-icon svg { width: 24px; height: 24px; }
.fv-icon.fv-outlined { border: 1px solid var(--fv-outline-variant); }
.fv-icon[aria-pressed="true"] { background: var(--fv-secondary-container); color: var(--fv-on-secondary-container); }
.fv-filled { background: var(--fv-primary); color: var(--fv-on-primary); min-height: 48px; padding: 0 28px; }
.fv-tonal { background: var(--fv-secondary-container); color: var(--fv-on-secondary-container); }
.fv-small { width: 40px; height: 40px; }

/* ---- the card ---- */
.fv-stage { perspective: 1800px; }
.fv-card {
  position: relative; display: grid; cursor: pointer; outline: none;
  transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2, .75, .25, 1);
  border-radius: calc(28px * var(--fv-corner));
}
.fv-card.fv-flipped { transform: rotateY(180deg); }
.fv-card.fv-instant, .fv-card.fv-instant .fv-face { transition: none !important; }
.fv-card:focus-visible { box-shadow: 0 0 0 3px var(--fv-primary); }
.fv-face {
  grid-area: 1 / 1; min-height: clamp(240px, 44vh, 520px); min-width: 0;
  display: flex; flex-direction: column; gap: 14px;
  padding: 22px 28px 26px; border-radius: inherit;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.fv-front {
  background: var(--fv-surface-container-low); border: 1px solid var(--fv-outline-variant);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 4px 16px rgba(0, 0, 0, .06);
}
.fv-back {
  transform: rotateY(180deg);
  background: var(--fv-primary-container); color: var(--fv-on-primary-container);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 4px 16px rgba(0, 0, 0, .06);
}
.fv-label { display: flex; align-items: center; gap: 8px; min-height: 24px; font-size: .75em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .72; }
.fv-chip { padding: 2px 10px; border-radius: 8px; font-size: .95em; letter-spacing: .02em; text-transform: none; border: 1px solid currentColor; opacity: .9; }
.fv-body { margin: auto 0; text-align: center; font-size: 1.4em; line-height: 1.45; overflow-wrap: anywhere; }
.fv-body.fv-long { text-align: start; font-size: 1.08em; line-height: 1.6; }
.fv-tap { text-align: center; font-size: .78em; opacity: .55; }
.fv-hint {
  padding: 10px 14px; border-radius: calc(12px * var(--fv-corner)); font-size: .95em;
  background: var(--fv-tertiary-container); color: var(--fv-on-tertiary-container);
  animation: fv-in .2s ease;
}
.fv-hint b { font-weight: 600; }
.fv-expl { padding-top: 12px; border-top: 1px solid currentColor; border-top-color: color-mix(in srgb, currentColor 25%, transparent); font-size: .98em; }

/* multiple choice */
.fv-options { display: grid; gap: 8px; margin-top: 4px; }
.fv-opt {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 14px; border-radius: calc(14px * var(--fv-corner)); cursor: pointer; text-align: start;
  background: var(--fv-surface); border: 1px solid var(--fv-outline-variant); overflow: hidden;
}
.fv-opt::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; }
.fv-opt:hover::before { opacity: .06; }
.fv-opt:focus-visible { outline: 3px solid var(--fv-primary); outline-offset: 1px; }
.fv-opt .fv-letter {
  flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%;
  font-size: .8em; font-weight: 700; background: var(--fv-secondary-container); color: var(--fv-on-secondary-container);
}
.fv-opt .fv-otext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fv-opt .fv-otext p { margin: 0; }
.fv-opt svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
.fv-options.fv-answered .fv-opt { cursor: default; }
.fv-options.fv-answered .fv-opt::before { opacity: 0; }
.fv-opt.fv-right { border-color: var(--fv-good); box-shadow: inset 0 0 0 1px var(--fv-good); }
.fv-opt.fv-right .fv-letter { background: var(--fv-good); color: var(--fv-surface); }
.fv-opt.fv-right svg { color: var(--fv-good); }
.fv-opt.fv-wrong { background: var(--fv-error-container); color: var(--fv-on-error-container); border-color: var(--fv-error); }
.fv-opt.fv-wrong .fv-letter { background: var(--fv-error); color: var(--fv-surface); }
.fv-opt.fv-dim { opacity: .55; }
.fv-verdict { text-align: center; font-weight: 600; font-size: .95em; animation: fv-in .2s ease; }
.fv-verdict.fv-ok { color: var(--fv-good); }
.fv-verdict.fv-no { color: var(--fv-error); }

/* ---- controls ---- */
.fv-nav { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.fv-keys { text-align: center; font-size: .75em; color: var(--fv-on-surface-variant); opacity: .8; margin-top: auto; }
.fv-keys kbd { font-family: var(--fv-mono); font-size: .95em; padding: 1px 6px; border-radius: 6px; background: var(--fv-surface-container-high); }
.fv-empty { margin: auto; text-align: center; color: var(--fv-on-surface-variant); }

/* ---- card content (Markdown) ---- */
.fv-md > :first-child { margin-top: 0; }
.fv-md > :last-child { margin-bottom: 0; }
.fv-md p { margin: 0 0 .6em; }
.fv-md h3 { margin: 0 0 .4em; font-size: 1.15em; font-weight: 600; }
.fv-md ul, .fv-md ol { margin: 0 0 .6em; padding-left: 1.4em; text-align: start; display: inline-block; max-width: 100%; }
.fv-md li + li { margin-top: .2em; }
.fv-md blockquote { margin: 0 0 .6em; padding: 2px 0 2px 14px; border-left: 3px solid currentColor; opacity: .85; text-align: start; }
.fv-md code { font-family: var(--fv-mono); font-size: .88em; padding: .08em .38em; border-radius: 6px; background: rgba(127, 127, 127, .16); }
.fv-md pre {
  margin: 0 0 .6em; padding: 12px 14px; overflow-x: auto; text-align: start; font-size: .82em; line-height: 1.5;
  border-radius: calc(12px * var(--fv-corner)); background: rgba(127, 127, 127, .14);
}
.fv-md pre code { padding: 0; background: none; font-size: 1em; }
.fv-md a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.fv-md del { opacity: .7; }
.fv-md img {
  display: inline-block; max-width: 100%; max-height: 42vh; vertical-align: middle;
  border-radius: calc(12px * var(--fv-corner));
}
.fv-md p > img:only-child { display: block; margin: 0 auto; }
.fv-math-display { display: block; margin: .3em 0; overflow-x: auto; overflow-y: hidden; }
.fv-math:not(.fv-ready) { font-family: var(--fv-mono); font-size: .9em; }
.katex { font-size: 1.1em; }

@keyframes fv-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fv-from-right { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes fv-from-left { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
.fv-stage.fv-go-next { animation: fv-from-right .28s cubic-bezier(.2, .75, .25, 1); }
.fv-stage.fv-go-prev { animation: fv-from-left .28s cubic-bezier(.2, .75, .25, 1); }

@media (max-width: 560px) {
  .fv-app { padding: 16px 12px 16px; gap: 14px; }
  .fv-emoji { width: 44px; height: 44px; font-size: 24px; }
  .fv-title { font-size: 1.3em; }
  .fv-face { padding: 18px 18px 20px; min-height: clamp(220px, 50vh, 520px); }
  .fv-body { font-size: 1.22em; }
  .fv-keys { display: none; }
  .fv-nav { gap: 8px; }
}
/* Reduced motion: the system setting, or the app's (set by the deck helper). */
@media (prefers-reduced-motion: reduce) {
  .fv-card { transition: none; }
  .fv-card.fv-flipped { transform: none; }
  .fv-card .fv-back { transform: none; visibility: hidden; }
  .fv-card.fv-flipped .fv-back { visibility: visible; }
  .fv-card.fv-flipped .fv-front { visibility: hidden; }
  .fv-stage.fv-go-next, .fv-stage.fv-go-prev, .fv-hint, .fv-verdict { animation: none; }
}
:root[data-fv-reduce-motion] .fv-card { transition: none; }
:root[data-fv-reduce-motion] .fv-card.fv-flipped { transform: none; }
:root[data-fv-reduce-motion] .fv-card .fv-back { transform: none; visibility: hidden; }
:root[data-fv-reduce-motion] .fv-card.fv-flipped .fv-back { visibility: visible; }
:root[data-fv-reduce-motion] .fv-card.fv-flipped .fv-front { visibility: hidden; }
:root[data-fv-reduce-motion] .fv-stage, :root[data-fv-reduce-motion] .fv-hint, :root[data-fv-reduce-motion] .fv-verdict { animation: none !important; }
</style>

      }
      if ((m = /^\s*(\$\$|\\\[)\s*$/.exec(line))) {
        var close = m[1] === '$$' ? /^\s*\$\$\s*$/ : /^\s*\\\]\s*$/;
        var j = i + 1, body = [];
        while (j < lines.length && !close.test(lines[j])) body.push(lines[j++]);
        if (j < lines.length) {
          flush();
          out.push('<p>' + mathHtml(m[1] + body.join('\n') + (m[1] === '$$' ? '$$' : '\\]')) + '</p>');
          i = j + 1;
          continue;
        }
      }
      if ((m = /^\s*(#{1,6})\s+(.*)$/.exec(line))) { flush(); out.push('<h3>' + inline(m[2]) + '</h3>'); i++; continue; }
      if (/^\s*([-*+]|\d{1,3}[.)])\s+/.test(line)) {
        flush();
        var ordered = /^\s*\d/.test(line), items = [];
        while (i < lines.length && (m = /^\s*([-*+]|\d{1,3}[.)])\s+(.*)$/.exec(lines[i])) && /^\d/.test(m[1]) === ordered) {
          items.push('<li>' + inline(m[2]) + '</li>');
          i++;
        }
        out.push(ordered ? '<ol>' + items.join('') + '</ol>' : '<ul>' + items.join('') + '</ul>');
        continue;
      }
      if (/^\s*>/.test(line)) {
        flush();
        var quote = [];
        while (i < lines.length && (m = /^\s*>\s?(.*)$/.exec(lines[i]))) { quote.push(inline(m[1])); i++; }
        out.push('<blockquote>' + quote.join('<br>') + '</blockquote>');
        continue;
      }
      if (!line.trim()) { flush(); i++; continue; }
      para.push(line);
      i++;
    }
    flush();
    return out.join('');
  }

  var plainLength = function (s) { return String(s || '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').length; };
  var isLong = function (s) { return plainLength(s) > 140 || /(^|\n)\s*([-*+]\s|\d+[.)]\s|```|>|#)/.test(s || '') || /\n\s*\n/.test(s || ''); };

  // ------------------------------------------------------------------ KaTeX
  var katexPromise = null;
  function loadFrom(base) {
    return new Promise(function (resolve, reject) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = base + 'katex.min.css';
      document.head.appendChild(link);
      var s = document.createElement('script');
      s.src = base + 'katex.min.js';
      s.onload = function () { window.katex ? resolve(window.katex) : reject(new Error('no katex')); };
      s.onerror = function () { link.remove(); s.remove(); reject(new Error('katex failed to load')); };
      document.head.appendChild(s);
    });
  }
  function loadKatex() {
    if (window.katex) return Promise.resolve(window.katex);
    if (!katexPromise) {
      var vendor = typeof window.__fvVendor === 'string' ? window.__fvVendor : '';
      katexPromise = (vendor ? loadFrom(vendor + 'katex/') : Promise.reject(new Error('no vendor')))
        .catch(function () { return loadFrom(KATEX_CDN); });
      katexPromise.catch(function () { katexPromise = null; });
    }
    return katexPromise;
  }
  function renderMath(root) {
    var nodes = root.querySelectorAll('.fv-math:not(.fv-ready)');
    if (!nodes.length) return;
    loadKatex().then(function (katex) {
      nodes.forEach(function (el) {
        try {
          katex.render(el.getAttribute('data-tex') || '', el, { displayMode: el.hasAttribute('data-display'), throwOnError: false });
          el.classList.add('fv-ready');
        } catch (e) { /* leave the TeX source visible */ }
      });
    }, function () { /* offline and no bundled copy: the TeX source stays visible */ });
  }

  // ------------------------------------------------------------------ deck state
  var app = document.getElementById('fv-app');
  var deck = { title: '', emoji: '', description: '', cards: [] };
  var order = [];       // indices into deck.cards, in viewing order
  var pos = 0;
  var flipped = false;
  var hintOpen = false;
  var shuffled = false;
  var picks = {};       // card index -> chosen option (multiple choice)
  var previewing = false;

  function readDeck() {
    var el = document.getElementById('fv-deck-data');
    try { return JSON.parse(el ? el.textContent : '{}') || {}; } catch (e) { return {}; }
  }

  function setDeck(d, keepPlace) {
    deck = {
      title: String(d.title || ''), emoji: String(d.emoji || ''), description: String(d.description || ''),
      cards: (Array.isArray(d.cards) ? d.cards : []).filter(function (c) { return c && String(c.front || '').trim(); })
    };
    images = d.images && typeof d.images === 'object' ? d.images : {};
    var n = deck.cards.length;
    if (!keepPlace || order.length !== n) {
      order = deck.cards.map(function (_, i) { return i; });
      if (shuffled) shuffle(order);
    }
    pos = Math.max(0, Math.min(pos, n - 1));
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ------------------------------------------------------------------ rendering
  function renderShell() {
    var head = '';
    if (deck.emoji || deck.title || deck.description) {
      head = '<header class="fv-head">' + (deck.emoji ? '<div class="fv-emoji" aria-hidden="true">' + esc(deck.emoji) + '</div>' : '') +
        '<div class="fv-titles"><h1 class="fv-title">' + esc(deck.title || 'Untitled deck') + '</h1>' +
        (deck.description.trim() ? '<div class="fv-desc fv-md">' + md(deck.description) + '</div>' : '') + '</div></header>';
    }
    if (!deck.cards.length) {
      app.innerHTML = head + '<div class="fv-empty"><p>This deck has no cards yet.</p></div>';
      return;
    }
    app.innerHTML = head +
      '<div class="fv-bar"><span class="fv-count" aria-live="polite"></span><div class="fv-track"><div class="fv-fill"></div></div>' +
      '<button class="fv-btn fv-icon fv-small" data-act="shuffle" aria-pressed="' + shuffled + '" title="Shuffle (S)">' + icon('shuffle') + '</button>' +
      '<button class="fv-btn fv-icon fv-small" data-act="restart" title="Start over">' + icon('restart') + '</button></div>' +
      '<main class="fv-stage"><div class="fv-card" tabindex="0" role="button" aria-label="Flashcard. Press Space to flip.">' +
      '<section class="fv-face fv-front"></section><section class="fv-face fv-back" aria-hidden="true"></section></div></main>' +
      '<nav class="fv-nav">' +
      '<button class="fv-btn fv-icon fv-outlined" data-act="prev" title="Previous (←)">' + icon('prev') + '</button>' +
      '<button class="fv-btn fv-icon" data-act="hint" title="Hint (H)">' + icon('hint') + '</button>' +
      '<button class="fv-btn fv-filled" data-act="flip">' + icon('flip') + '<span>Show answer</span></button>' +
      '<button class="fv-btn fv-icon fv-outlined" data-act="next" title="Next (→)">' + icon('next') + '</button></nav>' +
      '<div class="fv-keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Space</kbd> flip · <kbd>H</kbd> hint · <kbd>S</kbd> shuffle</div>';
    renderMath(app.querySelector('.fv-head') || app);
    renderCard();
  }

  function renderCard(direction) {
    var cardEl = app.querySelector('.fv-card');
    if (!cardEl) return;
    var idx = order[pos];
    var c = deck.cards[idx] || {};
    var n = order.length;
    var mcq = c.type === 'mcq' && Array.isArray(c.choices) && c.choices.length >= 2;
    var chip = c.category && String(c.category).trim() ? '<span class="fv-chip">' + esc(c.category) + '</span>' : '';

    var front = '<div class="fv-label">' + (mcq ? 'Choose an answer' : 'Question') + chip + '</div>' +
      '<div class="fv-body fv-md' + (isLong(c.front) ? ' fv-long' : '') + '">' + md(c.front) + '</div>';
    if (mcq) {
      var picked = picks[idx];
      var answered = picked != null;
      front += '<div class="fv-options' + (answered ? ' fv-answered' : '') + '" role="group">';
      c.choices.forEach(function (o, k) {
        var cls = '';
        var mark = '';
        if (answered) {
          if (k === c.correct) { cls = ' fv-right'; mark = icon('check'); }
          else if (k === picked) { cls = ' fv-wrong'; mark = icon('close'); }
          else cls = ' fv-dim';
        }
        front += '<button class="fv-opt' + cls + '" data-opt="' + k + '"' + (answered ? ' aria-disabled="true"' : '') + '>' +
          '<span class="fv-letter">' + 'ABCDEFGH'[k] + '</span><span class="fv-otext fv-md">' + md(o) + '</span>' + mark + '</button>';
      });
      front += '</div>';
      if (answered) {
        front += picked === c.correct ? '<div class="fv-verdict fv-ok">Correct!</div>'
          : '<div class="fv-verdict fv-no">Not quite — the answer is ' + 'ABCDEFGH'[c.correct] + '.</div>';
      }
    }
    if (hintOpen && c.hint) front += '<div class="fv-hint"><b>Hint:</b> <span class="fv-md">' + md(c.hint) + '</span></div>';
    if (!mcq) front += '<div class="fv-tap">Tap the card or press Space to flip</div>';

    var answer = mcq ? (c.choices[c.correct] || '') : c.back;
    var back = '<div class="fv-label">Answer' + chip + '</div>' +
      '<div class="fv-body fv-md' + (isLong(answer) || c.explanation ? ' fv-long' : '') + '">' +
      (mcq ? '<p><strong>' + 'ABCDEFGH'[c.correct] + '.</strong></p>' : '') + md(answer) + '</div>';
    if (c.explanation && String(c.explanation).trim()) back += '<div class="fv-expl fv-md">' + md(c.explanation) + '</div>';

    if (direction) {
      cardEl.classList.add('fv-instant');
      flipped = false;
    }
    cardEl.querySelector('.fv-front').innerHTML = front;
    cardEl.querySelector('.fv-back').innerHTML = back;
    applyFlip();
    if (direction) {
      void cardEl.offsetWidth;
      cardEl.classList.remove('fv-instant');
      var stage = app.querySelector('.fv-stage');
      stage.classList.remove('fv-go-next', 'fv-go-prev');
      void stage.offsetWidth;
      stage.classList.add(direction > 0 ? 'fv-go-next' : 'fv-go-prev');
    }

    app.querySelector('.fv-count').textContent = (pos + 1) + ' / ' + n;
    app.querySelector('.fv-fill').style.width = ((pos + 1) / n * 100) + '%';
    app.querySelector('[data-act="prev"]').disabled = pos === 0;
    var nextBtn = app.querySelector('[data-act="next"]');
    nextBtn.innerHTML = icon(pos === n - 1 ? 'restart' : 'next');
    nextBtn.title = pos === n - 1 ? 'Start over' : 'Next (→)';
    var hintBtn = app.querySelector('[data-act="hint"]');
    hintBtn.hidden = !c.hint;
    hintBtn.setAttribute('aria-pressed', String(hintOpen));
    renderMath(cardEl);
  }

  function applyFlip() {
    var cardEl = app.querySelector('.fv-card');
    if (!cardEl) return;
    cardEl.classList.toggle('fv-flipped', flipped);
    cardEl.querySelector('.fv-front').setAttribute('aria-hidden', String(flipped));
    cardEl.querySelector('.fv-back').setAttribute('aria-hidden', String(!flipped));
    var label = app.querySelector('[data-act="flip"] span');
    if (label) label.textContent = flipped ? 'Show question' : 'Show answer';
  }

  // ------------------------------------------------------------------ actions
  function go(delta) {
    var n = order.length;
    if (!n) return;
    if (delta > 0 && pos === n - 1) { restart(); return; }
    var next = Math.max(0, Math.min(n - 1, pos + delta));
    if (next === pos) return;
    pos = next;
    hintOpen = false;
    renderCard(delta);
  }
  function flip() { flipped = !flipped; applyFlip(); }
  function restart() {
    pos = 0; picks = {}; hintOpen = false;
    if (shuffled) shuffle(order);
    renderCard(-1);
  }
  function toggleShuffle() {
    shuffled = !shuffled;
    var current = order[pos];
    order = deck.cards.map(function (_, i) { return i; });
    if (shuffled) {
      shuffle(order);
      order.splice(order.indexOf(current), 1);
      order.unshift(current);
      pos = 0;
    } else {
      pos = order.indexOf(current);
    }
    var b = app.querySelector('[data-act="shuffle"]');
    if (b) b.setAttribute('aria-pressed', String(shuffled));
    renderCard();
  }
  function toggleHint() {
    var c = deck.cards[order[pos]];
    if (!c || !c.hint) return;
    hintOpen = !hintOpen;
    if (flipped) { flipped = false; }
    renderCard();
  }
  function choose(k) {
    var idx = order[pos];
    var c = deck.cards[idx];
    if (!c || c.type !== 'mcq' || picks[idx] != null || k < 0 || k >= (c.choices || []).length) return;
    picks[idx] = k;
    renderCard();
  }

  app.addEventListener('click', function (e) {
    var t = e.target;
    var opt = t.closest && t.closest('.fv-opt');
    if (opt) { e.stopPropagation(); choose(+opt.getAttribute('data-opt')); return; }
    var btn = t.closest && t.closest('[data-act]');
    if (btn) {
      var act = btn.getAttribute('data-act');
      if (act === 'prev') go(-1);
      else if (act === 'next') go(1);
      else if (act === 'flip') flip();
      else if (act === 'hint') toggleHint();
      else if (act === 'shuffle') toggleShuffle();
      else if (act === 'restart') restart();
      return;
    }
    if (t.closest && t.closest('a')) return;
    if (t.closest && t.closest('.fv-card')) {
      if (swiped) return;
      var sel = window.getSelection && String(window.getSelection());
      if (sel) return;
      flip();
    }
  });

  // Swipe left / right on touch screens.
  var sx = 0, sy = 0, swiped = false, tracking = false;
  app.addEventListener('pointerdown', function (e) {
    tracking = e.pointerType !== 'mouse' && !!(e.target.closest && e.target.closest('.fv-stage'));
    swiped = false; sx = e.clientX; sy = e.clientY;
  });
  app.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiped = true;
      go(dx < 0 ? 1 : -1);
      setTimeout(function () { swiped = false; }, 350);
    }
  });

  window.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (e.target && e.target.isContentEditable)) return;
    var onButton = tag === 'BUTTON' || tag === 'A';
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown') { go(1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { go(-1); e.preventDefault(); }
    else if ((k === ' ' || k === 'Enter') && !onButton) { flip(); e.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') { flip(); e.preventDefault(); }
    else if (k === 'h' || k === 'H') toggleHint();
    else if (k === 's' || k === 'S') toggleShuffle();
    else if (k === 'Home') { pos = 0; renderCard(-1); }
    else if (!flipped && /^[1-8]$/.test(k)) choose(+k - 1);
    else if (!flipped && /^[a-hA-H]$/.test(k) && k.toLowerCase() !== 'h') choose(k.toLowerCase().charCodeAt(0) - 97);
  });

  // ------------------------------------------------------------------ live preview (deck editor)
  var THEME_KEYS = /^--fv-[a-z-]+$/;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!previewing || !d || typeof d !== 'object' || !d.fvPreview || e.source !== window.parent) return;
    var p = d.fvPreview;
    if (p.theme && typeof p.theme === 'object') {
      var root = document.documentElement;
      Object.keys(p.theme.vars || {}).forEach(function (k) { if (THEME_KEYS.test(k)) root.style.setProperty(k, String(p.theme.vars[k])); });
      root.setAttribute('data-fv-mode', p.theme.dark ? 'dark' : 'light');
    }
    if (p.deck) {
      var firstTime = !deck.cards.length && !order.length;
      setDeck(p.deck, !firstTime);
      if (typeof p.index === 'number') {
        var wanted = p.index;
        // Show the card being edited (by its position in the editor, counting only cards with a front).
        var at = order.indexOf(wanted);
        if (at >= 0 && at !== pos) { pos = at; flipped = !!p.back; hintOpen = false; }
        else if (at >= 0 && typeof p.back === 'boolean') flipped = p.back;
      }
      renderShell();
    }
  });

  // ------------------------------------------------------------------ start
  previewing = !!window.__fvPreview;
  setDeck(readDeck(), false);
  renderShell();
})();
</script>
</body>
</html>
