name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (it publishes the GitHub Release).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install beautifulsoup4 pytest
          pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: JavaScript tests (Android backend)
        run: |
          npm install --no-audit --no-fund
          npm test

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel (what in-app updates install on Linux)
        run: |
          pip wheel . --no-deps -w dist
          pip install --no-deps dist/*.whl
          python -c "import flashcard_viewer, pathlib; p = pathlib.Path(flashcard_viewer.__file__).parent; assert (p / 'ui/index.html').exists() and (p / 'ui/vendor/material.js').exists()"
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: dist/*.whl
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    env:
      # Only whether a certificate exists; the secret itself goes to the signing steps alone.
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Freeze with PyInstaller
        run: pyinstaller packaging/windows/flashcard-viewer.spec --noconfirm --distpath dist --workpath build/pyi
      # Optional Authenticode signing, for when you have a code-signing certificate (.pfx). It shows
      # your name as the publisher and, with a trusted certificate, stops SmartScreen warnings.
      # Updates are protected by the release signature below either way.
      - name: Code-sign the app (optional)
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $files = @(Get-ChildItem dist\FlashcardViewer\FlashcardViewer.exe, dist\Riffle-Setup-*.exe -ErrorAction SilentlyContinue | ForEach-Object FullName)
          & $signtool sign /f $pfx /p $env:WIN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FlashcardViewer\FlashcardViewer.exe -ArgumentList '--version' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "FlashcardViewer.exe exited with $($p.ExitCode)" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path flashcard_viewer\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*.exe
      - name: Code-sign the installer (optional)
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $files = @(Get-ChildItem dist\FlashcardViewer\FlashcardViewer.exe, dist\Riffle-Setup-*.exe -ErrorAction SilentlyContinue | ForEach-Object FullName)
          & $signtool sign /f $pfx /p $env:WIN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/Riffle-Setup-*.exe
          if-no-files-found: error
      # Microsoft Store package. The identity values come from Partner Center (Product identity page),
      # saved as repository variables; without them the package uses placeholders and can't be submitted.
      # It isn't signed: the Store signs it on submission. Not attached to the GitHub release.
      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $a = @{}
          if ($env:MSIX_IDENTITY_NAME) { $a.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $a.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $a.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          if (-not $env:MSIX_IDENTITY_NAME) { Write-Host "::warning title=MSIX identity not set::Set the MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME repository variables from Partner Center to get a package you can submit." }
          & packaging\windows\make-msix.ps1 @a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microsoft-store-msix
          path: dist/Riffle-*.msix
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Only whether a signing key exists; the key itself goes to the signing step alone.
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.9"
      # The passwords only reach the one step that signs, through its environment (never pasted into
      # a script or exported to later steps); the keystore file is deleted right after.
      - name: Build signed release APK
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          gradle -p android assembleRelease --no-daemon --stacktrace
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' flashcard_viewer/__init__.py)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Riffle-$ver.apk"
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
      # Without the secrets (forks, or before the key is set up) only a debug build is made, and the
      # release gets no APK: a build signed with any other key couldn't update installed apps.
      - name: Build debug APK (no signing key configured)
        if: env.HAS_ANDROID_KEY != 'true'
        run: |
          echo "::warning title=Android signing key missing::Run tools/make-release-keys.sh and add the repository secrets it lists. This release will have no APK."
          gradle -p android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.HAS_ANDROID_KEY != 'true'
        with:
          name: debug-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Publishes (or refreshes) the GitHub Release "v<version>" from main, so the latest
  # setup.exe and APK are always one click away on the Releases page.
  release:
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' flashcard_viewer/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      # SHA256SUMS lists every file; SHA256SUMS.sig is its Ed25519 signature made with the private
      # release key. The apps only install updates whose signature matches the public key in
      # flashcard_viewer/signing.py.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          pub=$(sed -n 's/^RELEASE_PUBLIC_KEY = "\(.*\)"/\1/p' ../flashcard_viewer/signing.py)
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if [ -n "$pub" ]; then
              echo "::error title=Release signing key missing::flashcard_viewer/signing.py has a public key but the RELEASE_SIGNING_KEY secret is not set. Installed apps would refuse this release."
              exit 1
            fi
            echo "::warning title=Release not signed::Run tools/make-release-keys.sh to set up release signing."
            exit 0
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.pem"
          got=$(openssl pkey -in "$RUNNER_TEMP/release.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if [ "$got" != "$pub" ]; then
            echo "::error title=Release key mismatch::The RELEASE_SIGNING_KEY secret doesn't match the public key in flashcard_viewer/signing.py (expected '$pub', secret gives '$got')."
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.pem" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkey -in "$RUNNER_TEMP/release.pem" -pubout -out "$RUNNER_TEMP/release.pub"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release.pem"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Riffle ${{ steps.ver.outputs.version }}
          files: artifacts/*
          make_latest: true
          body: |
            ## What's new
            ${{ github.event.head_commit.message }}

            <!-- install -->
            ## Install
            **Windows 10/11:** download `Riffle-Setup-${{ steps.ver.outputs.version }}.exe` and run it.
            SmartScreen may warn because the installer isn't code-signed: choose *More info → Run anyway*.

            **Android 8.0+:** download `Riffle-${{ steps.ver.outputs.version }}.apk`, allow "Install unknown apps" for your
            browser or file manager, and open it. Keep *Android System WebView* updated from the Play Store.

            Already installed? The app finds new versions by itself and offers to update (Settings → About).

            **Linux:** `git clone` the repo and run `./install.sh` (see README).

            `SHA256SUMS.sig` is an Ed25519 signature of `SHA256SUMS`; check it with the public key in
            `packaging/release-signing-key.pem` (see SECURITY.md).
