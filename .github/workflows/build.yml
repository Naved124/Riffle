name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install beautifulsoup4 pytest
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests (Android backend)
        run: |
          npm install --no-audit --no-fund
          npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Freeze with PyInstaller
        run: pyinstaller packaging/windows/flashcard-viewer.spec --noconfirm --distpath dist --workpath build/pyi
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FlashcardViewer\FlashcardViewer.exe -ArgumentList '--version' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "FlashcardViewer.exe exited with $($p.ExitCode)" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path flashcard_viewer\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FlashcardViewer-Setup-*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Use your own signing key (optional)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' flashcard_viewer/__init__.py)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FlashcardViewer-$ver.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
